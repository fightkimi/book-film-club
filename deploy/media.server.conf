gzip on;
gzip_types application/json;
gzip_vary on;
gzip_min_length 1024;

# Only public, named TMDB posters at the two sizes used by the client.
location ~ "^/media/tmdb/(w342|w500)/[A-Za-z0-9_-]{1,100}\.jpg$" {
    limit_except GET { deny all; }
    rewrite ^/media/tmdb/(.*)$ /t/p/$1? break;
    proxy_pass https://image.tmdb.org;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host image.tmdb.org;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_cache uneco_covers;
    proxy_cache_key $uri;
    proxy_cache_lock on;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_hide_header Set-Cookie;
    add_header X-Cover-Cache $upstream_cache_status;
    add_header Strict-Transport-Security "max-age=86400" always;
    expires 7d;
}
